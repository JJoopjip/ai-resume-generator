# master.example.yaml — a FICTIONAL persona for demos, tests, and portfolio use.
#
# Everything below is invented (person, companies, metrics). It exists so a
# fresh clone of this repo can run `validate`/`render` and see the pipeline work
# without anyone's private data. Your real bank lives in ./master.yaml (git-
# ignored) or wherever RESUME_GEN_MASTER points — see the README "Your data".
#
# It mirrors the real schema exactly: profiles (bd/pm/dm/general), per-bullet
# `variants` keyed by profile, `themes`, a `summaries` bank, `highlights`,
# `skills` groups, `projects`, and an `additional: true` role. Keep it valid:
# `python3 -m pytest tests/test_example_master.py` renders it to one page.
schema_version: 1.0

authoring_rules:
  locked_fields:
    - metrics/numbers (e.g. "35%", "12", "3x", "$1.2M")
    - dates and durations
    - job titles
    - company names and locations
    - degree names, GPA, certifications
  rephrasable:
    - summary prose
    - "connective phrasing within a bullet (verbs, framing) — provided every locked field inside it is preserved verbatim"
  hard_rules:
    - Never invent an achievement, metric, tool, or responsibility not present here.
    - Never upgrade a number or a scope word ("supported" -> "led") to fit a JD.
    - Output is a DRAFT for human review; never auto-submit.
    - One page. If content overflows, drop the lowest-priority bullets, don't shrink facts.

